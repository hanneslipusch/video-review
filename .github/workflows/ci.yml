name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
